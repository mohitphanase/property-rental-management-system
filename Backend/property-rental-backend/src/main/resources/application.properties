spring.application.name=property-rental-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/property_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA & Hibernate Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
jwt.secret=propertyrentalprojectsecretkeypropertyrentalprojectsecretkey
jwt.expiration=86400000

# File Upload Multipart Settings
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# OpenAI API Settings
openai.api.key=${GROQ_API_KEY}
openai.api.url=https://api.groq.com/openai/v1/chat/completions